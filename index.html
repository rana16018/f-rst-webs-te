
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little World</title>

    <style>
        body {
            background: #111111;
            color: #eeeeee;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #c7a6ff;
            font-size: 42px;
        }

        p {
            color: #aaaaaa;
            font-size: 18px;
            line-height: 1.6;
        }

        a {
            color: #c7a6ff;
        }

        .card {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #444444;
            border-radius: 16px;
            background: #1b1b1b;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Who Am I?</h1>

        <p>
            A quiet mind in a noisy world.
        </p>

        <p>
            I'm learning to code,
            one line at a time.
        </p>

        <a href="https://github.com/">My GitHub</a>
    </div>
</body>
</html>
